name: Build

# Builds ZapZap everywhere it can be built. The ui talks to X11 with raw Linux system calls (no libc), so
# it only exists for Linux; the engine (the WhatsApp connection) and the demo core are plain Rust and are
# built for Windows, macOS and FreeBSD as well.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux (ui + engine + demo core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the trimmed whatsapp-rust
        run: ./scripts/fetch-fork.sh
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Tests
        run: |
          cargo test -p zapzap-core
          cargo test -p zapzap-engine
          cargo test -p zapzap-qr
      - name: Build the ui (no_std, no libc)
        run: ./scripts/build-linux.sh
      - name: Build the engine (size-optimised)
        run: ./scripts/build-engine.sh
      - name: Build the demo core (static)
        run: CC_x86_64_unknown_linux_musl=gcc cargo build --release -p zapzap-core --bin zapzap-core --target x86_64-unknown-linux-musl
      - name: Collect
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-none/release/zapzap-ui dist/
          cp target/x86_64-unknown-linux-gnu/release/zapzap-engine dist/
          cp target/x86_64-unknown-linux-musl/release/zapzap-core dist/
          cp scripts/run-linux.sh dist/
          ls -l dist | tee "$GITHUB_STEP_SUMMARY"
          tar -czf zapzap-linux-x86_64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: zapzap-linux-x86_64
          path: zapzap-linux-x86_64.tar.gz

  portable:
    name: ${{ matrix.name }} (engine + demo core)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x86_64, os: windows-latest, slug: windows-x86_64, exe: .exe }
          - { name: macOS arm64, os: macos-latest, slug: macos-arm64, exe: "" }
          - { name: macOS x86_64, os: macos-13, slug: macos-x86_64, exe: "" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the trimmed whatsapp-rust
        run: ./scripts/fetch-fork.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: NASM (ring on Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Tests
        run: |
          cargo test -p zapzap-core
          cargo test -p zapzap-engine
          cargo test -p zapzap-qr
      - name: Build
        run: cargo build --release -p zapzap-engine -p zapzap-core --bins
      - name: Collect
        run: |
          mkdir -p dist
          cp "target/release/zapzap-engine${{ matrix.exe }}" dist/
          cp "target/release/zapzap-core${{ matrix.exe }}" dist/
          ls -l dist | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: zapzap-${{ matrix.slug }}
          path: dist

  freebsd:
    name: FreeBSD x86_64 (engine + demo core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build inside a FreeBSD VM
        uses: cross-platform-actions/action@v0.26.0
        with:
          operating_system: freebsd
          version: "14.2"
          shell: sh
          run: |
            set -eu
            sudo pkg install -y git curl ca_root_nss cmake
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            . "$HOME/.cargo/env"
            ./scripts/fetch-fork.sh
            # Outside the synced directory: the build tree is several gigabytes.
            export CARGO_TARGET_DIR="$HOME/target"
            cargo test -p zapzap-core
            cargo test -p zapzap-engine
            cargo test -p zapzap-qr
            cargo build --release -p zapzap-engine -p zapzap-core --bins
            mkdir -p dist
            cp "$CARGO_TARGET_DIR/release/zapzap-engine" "$CARGO_TARGET_DIR/release/zapzap-core" dist/
            ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: zapzap-freebsd-x86_64
          path: dist
